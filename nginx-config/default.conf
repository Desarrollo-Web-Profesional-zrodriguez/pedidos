# Bloque HTTP: Redirige permanentemente al HTTPS
server {
    listen 80;
    server_name localhost;

    # Redirección 301 (Permanente)
    return 301 https://$host$request_uri;
}

# Bloque HTTPS: El túnel seguro
server {
    listen 443 ssl;
    server_name localhost;

    # Rutas de los certificados dentro del contenedor
    ssl_certificate /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    # Endurecimiento TLS: Solo permitimos la versión más segura (TLS 1.3)
    ssl_protocols TLSv1.3;

    # El proxy hacia nuestro backend oculto
    location /api/ {
        proxy_pass http://app-logic:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}