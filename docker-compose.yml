version: '3.8'

services:
  # El Muro (Servidor Web Nginx)
  web-server:
    image: nginx:alpine
    container_name: guardian_nginx
    ports:
      # Aquí SÍ exponemos al mundo (host:contenedor)
      - "80:80"
      - "443:443"
    networks:
      - red_segura
    volumes:
      - ./nginx-config/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx-ssl:/etc/nginx/ssl
    depends_on:
      - app-logic

  # Tu Fortín (Backend Node.js)
  app-logic:
    build: 
      context: ./backend # Apunta a la carpeta donde creaste el Dockerfile
    container_name: backend_node
    expose:
      # LA RESTRICCIÓN DE RED: Solo expone el puerto a la red interna de Docker
      - "3001"
    networks:
      - red_segura

# Definición de la red aislada
networks:
  red_segura:
    driver: bridge